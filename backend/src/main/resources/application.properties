# Server Configuration
server.port=8080

# Application Name
spring.application.name=tts-backend

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000

# Database Configuration (H2 file-based with automatic persistence, PostgreSQL compatible)
spring.datasource.url=jdbc:h2:file:./data/ttsdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# File Upload Limits (For TXT, PDF, DOCX document processing)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Text-to-Speech Settings
app.tts.provider=${TTS_PROVIDER:google}
app.tts.max-text-length=2500
app.tts.audio-storage-path=./generated-audio

# Optional VoiceRSS Provider
app.tts.voicerss.api-key=${TTS_API_KEY:}
app.tts.voicerss.endpoint=https://api.voicerss.org/

# JWT Authentication
app.jwt.secret=9a3f7c4b6e8d1a2f5c7e9b0d2f4a6c8e1a3f5b7d9e0c2a4f6b8d0e2f4a6c8e1a
app.jwt.expiration-ms=86400000

# AI Text Enhancement (Summarize, Grammar, Rewrite, Conversational Speech)
app.ai.provider=${AI_PROVIDER:auto}
app.ai.api-key=${AI_API_KEY:}

# Cloud Storage Configuration (local or s3)
app.storage.type=${STORAGE_TYPE:local}
app.storage.s3.bucket=${S3_BUCKET:tts-audio-storage}
app.storage.s3.region=${AWS_REGION:us-east-1}

# Rate Limiting & Usage Limits
app.ratelimit.enabled=true
app.ratelimit.requests-per-minute=30
app.ratelimit.max-chars-per-request=2500

# Logging
logging.level.com.example.tts=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.graphql=INFO

# Spring for GraphQL Configuration
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.path=/graphql

